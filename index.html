<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index,follow">
    <title>GeoMap Lite</title>
    <link rel="canonical" href="https://superhedgehoger.github.io/Geomap-app/?variant=lite">
    <meta http-equiv="refresh" content="0; url=https://superhedgehoger.github.io/Geomap-app/?variant=lite">
    <style>
        body { font: 16px/1.6 system-ui, sans-serif; max-width: 42rem; margin: 12vh auto; padding: 0 1rem; color: #24324a; }
        a { color: #1769aa; }
    </style>
</head>
<body>
    <h1>GeoMap Lite</h1>
    <p>正在进入 Lite 版本。若浏览器没有自动跳转，请<a id="continue" href="https://superhedgehoger.github.io/Geomap-app/?variant=lite">点击这里</a>。</p>
    <script>
        const target = new URL('https://superhedgehoger.github.io/Geomap-app/');
        target.searchParams.set('variant', 'lite');
        document.getElementById('continue').href = target.toString();
        window.location.replace(target.toString());
    </script>
</body>
</html>
